<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Simple Register Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }

    form {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #e97508;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div class="container">
    
    <form id="registerForm">
        <h1>Register Form</h1>
        <input type="text" id="username" placeholder="Username" required />
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Register</button>
        <p>Already have an account? <a href="login.html">Login here</a></p>
        <div id="message"></div>
    </form>
</div>


<script>
  document.getElementById('registerForm').addEventListener('submit', function (e) {
    e.preventDefault(); // Stop default form submit

    const username = document.getElementById('username').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !email || !password) {
    //   showMessage('All fields are required!', 'red');
        alert('All fields are required!');
      return;
    }

    // Save to localStorage
    const user = { username, email, password };
    localStorage.setItem('user', JSON.stringify(user));

    // showMessage('Registered successfully!', 'green');
    setTimeout(() => {
      alert('Registered successfully! You can now login.');
      window.location.href = 'login.html'; // Redirect to login page
    }, 0);
  });

  function showMessage(text, color) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.style.color = color;
  }
</script>

</body>
</html>
<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content=
        "width=device-width, initial-scale=1.0">
    <title>
        How to use an Http get or 
        Post for my Ajax Calls?
    </title>
    
    <style>
        #container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #btnDiv {
            width: 20vw;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-around;
        }

        .btn {
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="container">
        <h2 id="heading">Hey Geek,</h2>
        <div id="btnDiv">
            <button class="btn" onclick="requestData()">
                Request Data
            </button>
        </div>
    </div>

    <script>
        var head = document.getElementById('heading');
        var request = new XMLHttpRequest();
        function requestData() {
            request.onload = function () {
                head.innerHTML = this.responseText;
            }
            request.open('GET', 'gfgInfo.txt', true);
            request.send();
        }
    </script>
</body>

</html>
